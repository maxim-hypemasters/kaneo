services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "1337:1337"
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

#  Optional
#  redis:
#    image: valkey/valkey
#    ports:
#      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - .env.local
    depends_on:
      - api
    restart: unless-stopped

  # Optional: `docker compose -f compose.local.yml --env-file .env.local
  # --profile agent up -d`, with KANEO_RUNNER_TOKEN and the AGENT_* settings
  # in .env.local. Only these reach the runner, never the server's secrets.
  agent-runner:
    build:
      context: .
      dockerfile: apps/agent-runner/Dockerfile
    profiles: ["agent"]
    environment:
      KANEO_API_URL: http://api:1337
      KANEO_RUNNER_TOKEN: ${KANEO_RUNNER_TOKEN:-}
      GH_TOKEN: ${AGENT_GH_TOKEN:-}
      GITHUB_APP_ID: ${AGENT_GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${AGENT_GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_PRIVATE_KEY: ${AGENT_GITHUB_PRIVATE_KEY:-}
      GITHUB_PRIVATE_KEY_BASE64: ${AGENT_GITHUB_PRIVATE_KEY_BASE64:-}
      OPENROUTER_API_KEY: ${AGENT_OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${AGENT_ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${AGENT_OPENAI_API_KEY:-}
      NOUS_API_KEY: ${AGENT_NOUS_API_KEY:-}
      GEMINI_API_KEY: ${AGENT_GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${AGENT_GOOGLE_API_KEY:-}
      HERMES_MODEL: ${AGENT_HERMES_MODEL:-}
      HERMES_PROVIDER: ${AGENT_HERMES_PROVIDER:-}
      GITHUB_HOST: ${AGENT_GITHUB_HOST:-}
      GIT_AUTHOR_NAME: ${AGENT_GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${AGENT_GIT_AUTHOR_EMAIL:-}
      ASSESS_CONCURRENCY: ${AGENT_ASSESS_CONCURRENCY:-}
      SHIP_CONCURRENCY: ${AGENT_SHIP_CONCURRENCY:-}
      ASSESS_TIMEOUT_MS: ${AGENT_ASSESS_TIMEOUT_MS:-}
      SHIP_TIMEOUT_MS: ${AGENT_SHIP_TIMEOUT_MS:-}
      ASSESS_MAX_TURNS: ${AGENT_ASSESS_MAX_TURNS:-}
      SHIP_MAX_TURNS: ${AGENT_SHIP_MAX_TURNS:-}
      SHIP_TOOLSETS: ${AGENT_SHIP_TOOLSETS:-}
    volumes:
      - agent_runner_work:/work
    depends_on:
      - api
    restart: unless-stopped

  docs:
    image: node:24.19.0-alpine
    working_dir: /app/apps/docs
    command: sh -c "npm install -g mintlify && mintlify dev --disable-openapi"
    ports:
      - "3421:3000"
    volumes:
      - ./apps/docs:/app/apps/docs
    restart: unless-stopped

volumes:
  postgres_data:
  agent_runner_work:
